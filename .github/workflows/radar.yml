name: Actualitza i publica Radar TIC
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: radar-pages
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    permissions:
      contents: read
      pages: read
    timeout-minutes: 45
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Recupera l’extracció anterior
        uses: actions/cache/restore@v4
        with:
          path: |
            site/data/radar.json.gz
            site/data/documents.json
            site/data/pdf-evidence.json
            site/data/sda.json
            site/data/boards.json
            site/data/balears.json
            site/data/executive.json
            site/data/news.json
          key: radar-data-${{ github.run_id }}
          restore-keys: radar-data-
      - name: Recupera la verificació documental
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: |
            site/data/document-validation.json
            site/data/document-validation-cache.json
          key: radar-validation-v2-${{ github.run_id }}
          restore-keys: radar-validation-v2-
      - name: Prepara la lectura de PDFs
        run: python -m pip install -r requirements.txt
      - name: Proves de coherència
        run: |
          python -m unittest discover -s tests -v
          node --check site/app.js
          node --check site/boards.js
          node tests/test_frontend.cjs
          node tests/test_boards.cjs
          node tests/test_core.mjs
          node tests/test_navigation.mjs
          node tests/test_news_view.mjs
          node --check site/workspace.js
          node --check site/workspace-pdf.js
      - name: Importa PSCP
        if: github.event_name != 'push'
        run: python scripts/refresh.py
      - name: Extreu documents estructurats
        if: github.event_name != 'push'
        run: python scripts/enrich.py
      - name: Verifica les relacions dels SDA CTTI
        if: github.event_name != 'push'
        run: python scripts/sda.py
      - name: Recupera totes les invitacions dels taulers SDA
        if: github.event_name != 'push'
        run: python scripts/boards.py
      - name: Extreu pistes dels informes PDF
        if: github.event_name != 'push'
        run: python scripts/pdf_evidence.py
      - name: Actualitza Govern Balear i sector instrumental
        if: github.event_name != 'push' || contains(github.event.head_commit.modified, 'scripts/balears.py')
        run: python scripts/balears.py
      - name: Actualitza notícies TIC i resums
        run: python scripts/news.py
      - name: Uneix els àmbits i els taulers SDA
        run: python scripts/catalog.py
      - name: Prepara dossiers executius
        if: github.event_name != 'push'
        run: python scripts/dossier_extract.py
      - name: Contrasta pròrrogues i dades amb els documents
        env:
          VALIDATION_LIMIT: ${{ github.event_name == 'push' && '0' || '120' }}
        run: python scripts/document_validation.py
      - name: Actualitza el canal de novetats
        run: python scripts/rss.py
      - name: Valida la publicació
        run: python scripts/validate.py
      - name: Comprimeix les dades públiques
        run: python scripts/pack.py
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          path: site
      - uses: actions/cache/save@v4
        with:
          path: |
            site/data/radar.json.gz
            site/data/documents.json
            site/data/pdf-evidence.json
            site/data/sda.json
            site/data/boards.json
            site/data/balears.json
            site/data/executive.json
            site/data/news.json
          key: radar-data-${{ github.run_id }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica amb una versió única
        id: deployment
        uses: actions/github-script@v9
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const mainRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const baseSha = mainRef.data.object.sha;
            const base = await github.rest.git.getCommit({ owner, repo, commit_sha: baseSha });
            const blob = await github.rest.git.createBlob({
              owner, repo,
              content: `${context.runId}.${context.runAttempt}\\n`,
              encoding: 'utf-8'
            });
            const tree = await github.rest.git.createTree({
              owner, repo,
              base_tree: base.data.tree.sha,
              tree: [{ path: '.github/radar-pages-version.txt', mode: '100644', type: 'blob', sha: blob.data.sha }]
            });
            const versionCommit = await github.rest.git.createCommit({
              owner, repo,
              message: `chore: radar Pages ${context.runId}.${context.runAttempt}`,
              tree: tree.data.sha,
              parents: [baseSha]
            });
            let versionRefExists = false;
            try {
              await github.rest.git.getRef({ owner, repo, ref: 'heads/radar-pages-version' });
              versionRefExists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (versionRefExists) {
              await github.rest.git.updateRef({
                owner, repo, ref: 'heads/radar-pages-version', sha: versionCommit.data.sha, force: true
              });
            } else {
              await github.rest.git.createRef({
                owner, repo, ref: 'refs/heads/radar-pages-version', sha: versionCommit.data.sha
              });
            }
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId)) throw new Error('Artifact de Pages no vàlid');
            const oidcToken = await core.getIDToken();
            const created = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo,
              artifact_id: artifactId,
              environment: 'github-pages',
              pages_build_version: versionCommit.data.sha,
              oidc_token: oidcToken
            });
            core.setOutput('page_url', created.data.page_url);
            core.info(`Versió ${versionCommit.data.sha}; publicació ${created.data.id}`);
            let status = 'queued';
            for (let attempt = 0; attempt < 120; attempt++) {
              const check = await github.request(`GET ${created.data.status_url}`, {
                headers: { accept: 'application/vnd.github+json' }
              });
              status = check.data.status;
              core.info(`Estat de Pages: ${status}`);
              if (status === 'succeed') break;
              if (['errored', 'failure', 'cancelled'].includes(status)) {
                throw new Error(`La publicació de Pages ha fallat: ${status}`);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (status !== 'succeed') throw new Error(`Temps d'espera excedit: ${status}`);
